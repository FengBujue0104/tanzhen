<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>探针 Tanzhen · 状态页</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>针</text></svg>" />
</head>
<body>
  <div class="bg-grid"></div>
  <header class="top">
    <div class="brand">
      <span class="logo">针</span>
      <div>
        <h1>探针 <span class="muted">Tanzhen</span></h1>
        <p class="sub">多节点 VPS 监控 · 简洁状态页</p>
      </div>
    </div>
    <div class="actions">
      <span id="clock" class="muted"></span>
      <a href="/admin" class="admin-link" title="管理后台">管理</a>
    </div>
  </header>

  <main>
    <section id="stats-bar" class="stats-bar"></section>
    <section id="grid" class="grid"></section>
    <p id="empty" class="empty hidden">暂无节点。请前往 <a href="/admin">管理后台</a> 添加并一键扎针。</p>
  </main>

  <footer>
    <span>Tanzhen · 自托管探针</span>
    <span class="muted" id="api-hint"></span>
  </footer>
  <script src="/assets/app.js"></script>
</body>
</html>
