services:
  hub:
    build:
      context: .
      args:
        # Stamped into the binaries. Defaults to "dev" for a local compose build.
        VERSION: ${VERSION:-dev}
    container_name: tanzhen-hub
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      ADMIN_USER: "${ADMIN_USER:-admin}"
      # Required. The hub refuses to start on the built-in "changeme" default, so
      # an unset ADMIN_PASSWORD is a loud failure, not an open admin API.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in your .env}"
      # The public origin agents are told to report to. Falls back to the
      # request's own Host header when unset.
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8080}"
      RELEASES_DIR: /app/releases
      TZ: "${TZ:-Asia/Hong_Kong}"
      # HTTPS 反代后取消注释（README「反向代理与 HTTPS」）。
      # 明文 HTTP 不要打开 COOKIE_SECURE，否则浏览器会丢掉 Session。
      # COOKIE_SECURE: "1"
      # TRUST_PROXY: "1"
      # Bind the admin API to its own port and publish only that one to a
      # firewall/loopback-restricted rule, e.g. "127.0.0.1:8443:8443".
      # ADMIN_ADDR: ":8443"
      # Optional JSON webhook (node offline / traffic quota near full).
      # WEBHOOK_URL: "https://webhook.site/your-uuid"
      # WEBHOOK_TRAFFIC_PCT: "90"
    volumes:
      - tanzhen-data:/data
      # Optional: mount prebuilt multi-arch agents over the baked-in set
      # - ./releases:/app/releases:ro
    restart: unless-stopped

volumes:
  tanzhen-data:
