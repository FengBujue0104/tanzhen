services:
  hub:
    build: .
    container_name: tanzhen-hub
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-changeme}"
      # Legacy: ADMIN_TOKEN still accepted as password if ADMIN_PASSWORD unset
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8080}"
      RELEASES_DIR: /app/releases
      TZ: Asia/Hong_Kong
    volumes:
      - tanzhen-data:/data
      # Optional: mount prebuilt multi-arch agents
      # - ./releases:/app/releases:ro
    restart: unless-stopped

volumes:
  tanzhen-data:
